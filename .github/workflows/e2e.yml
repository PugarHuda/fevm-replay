name: E2E

# The deployed site, clicked through by a real Chromium as a user would
# (e2e/tests): every page, link and asset, accessibility (axe), phones,
# every saved block validated in the browser, a tampered one refused, an
# uploaded archive, the module from Fe's latest commit, Glamsterdam checks,
# the tour playing, and the block check in Firefox and WebKit too. Tests tagged @live use public nodes (a block near the
# head with the light client, a whole block under Glamsterdam) and are
# retried; nothing is mocked. Every six hours too, as a monitor.
on:
  push:
    branches: [main]
    paths: [site/**, e2e/**, .github/workflows/e2e.yml]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # A push redeploys the site from git: wait until it serves this commit's
      # module, so the tests see the deployed commit, not the one before.
      - name: Wait for the deploy of this commit
        if: github.event_name == 'push'
        working-directory: .
        run: |
          want=$(sha256sum site/wasm/fevm_replay_web.wasm | cut -d' ' -f1)
          for i in $(seq 1 30); do
            got=$(curl -sf https://fevm-replay.vercel.app/wasm/fevm_replay_web.wasm | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] && exit 0
            sleep 20
          done
          echo "the site does not serve this commit's module after 10 minutes" && exit 1
      # The page's own provenance check, outside the browser too: the served
      # modules' attestations verify, and a changed bundle is refused.
      - name: Provenance of the served modules
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node web/provenance-test.mjs site/wasm/fevm_replay_web.wasm
          node web/provenance-test.mjs site/wasm/next/fevm_replay_web.wasm
      - run: npx playwright test
        env:
          BASE_URL: https://fevm-replay.vercel.app/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  # Score budgets for five pages (accessibility 95, best practices 90, SEO 90,
  # performance 80, desktop); the reports are kept as an artifact.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npx -y @lhci/cli@0.15.1 autorun --config=e2e/lighthouserc.json --upload.target=filesystem --upload.outputDir=lhci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: lhci
          retention-days: 14
