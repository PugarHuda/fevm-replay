name: Follow

# On demand: validate three new mainnet blocks statelessly with
# `fevm_replay follow` and commit them to the stateless blocks page's data
# (site/data/stateless.json) and its badge. It ran every six hours at
# first, but from GitHub's runners the free endpoints refuse the calls
# (block traces from eth.drpc.org, then proofs from publicnode, on
# 16 November), so it needs an endpoint of your own: set it as the
# repository secret RPC_URL (endpoint URLs often hold an API key, and
# secrets are masked in logs). Without it, publicnode is used.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: follow
  cancel-in-progress: false

env:
  FE_REVISION: e6e6342b252082f3fd8af5b9f763cb13296bf0a1
  RUST_VERSION: 1.99.0

jobs:
  follow:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 # zizmor: ignore[artipacked] -- this workflow commits and pushes

      - name: Restore the Fe compiler
        id: fe-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/fe
          key: fe-${{ runner.os }}-${{ env.FE_REVISION }}-${{ env.RUST_VERSION }}-cranelift

      - name: Build the Fe compiler
        if: steps.fe-cache.outputs.cache-hit != 'true'
        run: |
          npm install -g tree-sitter-cli@0.24.7
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo "+$RUST_VERSION" install --locked --root ~/fe \
            --git https://github.com/argotorg/fe --rev "$FE_REVISION" --features cranelift fe

      - run: echo "$HOME/fe/bin" >> "$GITHUB_PATH"

      - name: Build fevm-replay
        run: fe build --backend native -O 2 --emit executable --out-dir out .

      - name: Validate three head blocks
        env:
          RPC: ${{ secrets.RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
        run: |
          mkdir -p /tmp/follow
          ./out/fevm_replay follow /tmp/follow site/data/stateless.json 3 "$RPC"

      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stateless.json site/data/stateless.svg
          if git diff --cached --quiet; then exit 0; fi
          n=$(python3 -c "import json; print(sum(1 for r in json.load(open('site/data/stateless.json')) if r.get('every_root')))")
          git commit -m "Follower: $n mainnet blocks validated statelessly, every root in the header from fevm"
          git pull --rebase origin main
          git push origin HEAD:main
