name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Fe v26.7.0, the release that carries what fevm main (its chain layer)
  # needs and `Call::forward_delegatecall` (argotorg/fe#2004).
  FE_REVISION: e6e6342b252082f3fd8af5b9f763cb13296bf0a1
  # Every port builds with it too; their certificates are from 26.7 builds.
  RUST_VERSION: 1.99.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The README's and the site's numbers are the data's
        run: python3 docs/check-numbers.py

      - name: The workflows themselves (zizmor, no medium or high finding)
        run: pipx run zizmor==1.32.0 --offline --min-severity medium .github/workflows/

      - name: Every page is valid HTML (html-validate)
        run: cd site && npx -y html-validate@9.7.1 --config ../e2e/htmlvalidate.json *.html

      - name: Restore the Fe compiler
        id: fe-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/fe
          key: fe-${{ runner.os }}-${{ env.FE_REVISION }}-${{ env.RUST_VERSION }}-cranelift

      - name: Build the Fe compiler
        if: steps.fe-cache.outputs.cache-hit != 'true'
        # Fe's build generates its tree-sitter grammar, which needs the
        # tree-sitter CLI and node; `cranelift` is the native backend.
        run: |
          npm install -g tree-sitter-cli@0.24.7
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo "+$RUST_VERSION" install --locked --root ~/fe \
            --git https://github.com/argotorg/fe --rev "$FE_REVISION" --features cranelift fe


      - run: echo "$HOME/fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - run: fe fmt --check
      - run: fe test --backend native .

      - name: WETH9 port
        working-directory: ports/weth9
        run: |
          fe fmt --check
          fe test .
          fe build -O 2 --out-dir ../../out/weth9 .

      - name: Uniswap V2 pair port
        working-directory: ports/uniswap-v2-pair
        run: |
          fe fmt --check
          fe test .
          fe build -O 2 --out-dir ../../out/pair .

      - name: USDT (TetherToken) port
        working-directory: ports/usdt
        run: |
          fe fmt --check
          fe test .
          fe build -O 2 --out-dir ../../out/usdt .

      - name: USDC proxy port
        working-directory: ports/usdc-proxy
        run: |
          fe fmt --check
          fe test .
          fe build -O 2 --out-dir ../../out/usdc-proxy .

      - name: System contracts port (EIP-4788, EIP-2935)
        working-directory: ports/system
        run: |
          fe fmt --check
          fe test .
          fe build -O 2 --out-dir ../../out/system .

      - name: DAI port
        working-directory: ports/dai
        run: |
          fe fmt --check
          fe test .
          fe build -O 2 --out-dir ../../out/dai .

      - name: The core (ingots/replay_core)
        working-directory: ingots/replay_core
        run: |
          fe fmt --check
          fe test --backend native .

      - name: Merkle-Patricia proof ingot (ingots/mpt)
        working-directory: ingots/mpt
        run: |
          fe fmt --check
          fe test --backend native .

      - name: The proof check and a whole mainnet block on WebAssembly (web/, Fe 26.7's release binary)
        run: |
          curl -sSfL -o fe-release https://github.com/argotorg/fe/releases/download/v26.7.0/fe_linux_amd64
          chmod +x fe-release
          (cd web && ../fe-release fmt --check && ../fe-release build --backend wasm -O 2 --wasm-stack-size 67108864 --out-dir ../out/web .)
          python3 web/tailcalls.py out/web/fevm_replay_web.wasm out/web/fevm_replay_web.manifest.json
          cmp out/web/fevm_replay_web.wasm site/wasm/fevm_replay_web.wasm
          cmp out/web/fevm_replay_web.manifest.json site/wasm/fevm_replay_web.manifest.json
          cmp fixtures/proven/0x19335e5.tar.gz site/wasm/block-0x19335e5.tar.gz
          node web/test.mjs out/web/fevm_replay_web.wasm
          # The page downloads this module: keep it under 4.5 MB.
          size=$(stat -c %s out/web/fevm_replay_web.wasm)
          echo "browser module: $size bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -lt 4718592
          node site/wasm/cli.mjs fixtures/proven/0x19335e5.tar.gz | grep "every root holds"
          node web/lightclient-test.mjs
          (cd docs/eip4762-check && npm ci --ignore-scripts && WASM=../../out/web/fevm_replay_web.wasm MANIFEST=../../out/web/fevm_replay_web.manifest.json node compare.mjs ../../fixtures/proven/0x19335e5.tar.gz ../../fixtures/proven/0x192f56b.tar.gz)

      - name: Build fevm-replay
        run: fe build --backend native -O 2 --emit executable --out-dir out .

      - name: A mainnet block proven against its header (state roots, receipts root)
        run: |
          mkdir -p proven && tar xzf fixtures/proven/0x192f56b.tar.gz -C proven
          out=$(./out/fevm_replay chain proven/0x192f56b)
          echo "$out"
          echo "$out" | grep -q "126/126 transactions MATCH"
          echo "$out" | grep -q "receipts: fevm's 126 receipts hash to the header's receiptsRoot"
          echo "$out" | grep -q "pre-state: .* 0 differ"
          echo "$out" | grep -q "end state: .* 0 differ"

      - name: A mainnet block validated statelessly, every root in its header from fevm
        run: |
          tar xzf fixtures/proven/0x19335e5.tar.gz -C proven
          out=$(./out/fevm_replay chain proven/0x19335e5)
          echo "$out"
          echo "$out" | grep -q "71/71 transactions MATCH"
          echo "$out" | grep -q "system calls: fevm ran EIP-4788"
          echo "$out" | grep -q "receipts: fevm's 71 receipts hash to the header's receiptsRoot"
          echo "$out" | grep -q "transactions: 71 re-encoded, each hashes to its hash, and they hash to the header's transactionsRoot"
          echo "$out" | grep -q "withdrawals: 16 hash to the header's withdrawalsRoot"
          echo "$out" | grep -q "are the header's gasUsed, blobGasUsed and logsBloom"
          echo "$out" | grep -q "hash to the header's requestsHash"
          echo "$out" | grep -q "hashes to the header's stateRoot"
          echo "$out" | grep -q "binary tree (EIP-7864), estimated for the same keys: 564 stems, 947 values"
          echo "$out" | grep -q "block access list (EIP-7928): 26523 bytes for 210 accounts"
          echo "$out" | grep -q "the longest chain of dependent transactions is 13 of 71"
          python3 - <<'PY'
          import json
          s = json.load(open("proven/0x19335e5/summary.json"))
          assert s["number"] == 26424805 and s["matched"] == s["transactions"] == 71, s
          assert s["every_root"] and s["binary_stems"] == 564, s
          assert s["heaviest"][0]["address"] == "0xdac17f958d2ee523a2206206994597c13d831ec7", s["heaviest"][0]
          PY

      - name: The same block under Glamsterdam's execution rules (fevm's Config::amsterdam())
        run: |
          out=$(./out/fevm_replay amsterdam proven/0x19335e5)
          echo "$out"
          echo "$out" | grep -q "71 transactions, each on its own traced pre-state and its own gas limit; 1 no longer valid, 20 that succeeded would fail"
          echo "$out" | grep -q "fails under Amsterdam: ETH transfers 0xd1163b9a4766267495dd7f4989552f22108fc05d1fcfb4b436ce7ecf656999aa (gas limit 21000"
          echo "$out" | grep -q "why: of the 21 that no longer succeed, 21 would with a higher gas limit (median 182600 gas more"
          echo "$out" | grep -q "state gas, by what the transaction creates: a new account 8, code 0, storage slots filled from zero 4"
          echo "$out" | grep -q "contract calls that would fail, by contract called (9 contracts): 0xdac17f958d2ee523a2206206994597c13d831ec7 3; 0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48 2;"

      - name: The Fe system contracts do on a mainnet block what the deployed ones do
        run: |
          out=$(./out/fevm_replay system proven/0x19335e5 out/system/BeaconRoots.runtime.bin out/system/HistoryStorage.runtime.bin out/system/WithdrawalRequests.runtime.bin out/system/ConsolidationRequests.runtime.bin)
          echo "$out"
          echo "$out" | grep -q "EIP-4788 beacon roots: the system call writes what the header implies, deployed yes and Fe port yes"
          echo "$out" | grep -q "EIP-2935 history: the system call writes what the header implies, deployed yes and Fe port yes"
          echo "$out" | grep -q "EIP-7002 withdrawal requests: 5/5 calls"
          echo "$out" | grep -q "EIP-7251 consolidation requests: 5/5 calls"
          echo "$out" | grep -q "a queue of 17 requests and two end-of-block calls: 19/19 steps as deployed"
          echo "$out" | grep -q "the Fe ports did what the deployed ones did (52 reads)"

      - name: geth's own evm t8n on the same mainnet block and witness agrees with the header and the proven end state
        run: |
          curl -sSfL -o geth.tgz https://gethstore.blob.core.windows.net/builds/geth-alltools-linux-amd64-1.17.10-1df30b18.tar.gz
          echo "f991c32e5b7bb68db97a1b06d50c7c06f6aa9ae84d8f6f9b2301dc02cad2a7cf  geth.tgz" | sha256sum -c
          tar xzf geth.tgz --strip-components=1 geth-alltools-linux-amd64-1.17.10-1df30b18/evm
          out=$(./out/fevm_replay geth-block ./evm proven/0x19335e5)
          echo "$out"
          echo "$out" | grep -q "geth-block: 1 of 1 blocks agree with geth (71 transactions, 734 proven end values)"
          cp -r proven/0x19335e5 proven/tampered-geth
          python3 - <<'PY'
          import json
          p = "proven/tampered-geth/block.json"
          doc = json.load(open(p))
          w = doc["result"]["withdrawals"][0]
          w["amount"] = hex(int(w["amount"], 16) + 1)
          json.dump(doc, open(p, "w"))
          PY
          if ./out/fevm_replay geth-block ./evm proven/tampered-geth > tampered-geth.txt; then cat tampered-geth.txt; exit 1; fi
          grep "end state" tampered-geth.txt
          # Glamsterdam's rules in both engines, on the block's own signed transactions.
          out=$(./out/fevm_replay geth-amsterdam ./evm proven/0x19335e5 60 1)
          echo "$out"
          echo "$out" | grep -q "60/60 runs agree with geth (20 reverted, 2 rejected by both), 0 differ"

      - name: Mutation testing of the system contracts check
        run: |
          out=$(./out/fevm_replay mutants-system ports/system proven/0x19335e5)
          echo "$out"
          echo "$out" | grep -q "66 mutants built: 60 killed"

      - name: A mainnet block validated with its four system calls run by the Fe ports
        run: |
          out=$(./out/fevm_replay chain proven/0x19335e5 --system out/system)
          echo "$out" | grep -E "system calls|requests|stateRoot"
          echo "$out" | grep -q "both as the Fe ports"
          echo "$out" | grep -q "both request lists from the Fe ports"
          echo "$out" | grep -q "hashes to the header's stateRoot"

      - name: Two consecutive mainnet blocks validated as one chain, and refused in the wrong order
        run: |
          curl -sSfL -o pair.tar.gz https://github.com/PugarHuda/fevm-replay/releases/download/fixtures-1/0x19338ca-0x19338cb.tar.gz
          echo "0c773ddc1082f0d1c5945964744e2a1e378218e8bd6ed8cbbac34a192c445bbf  pair.tar.gz" | sha256sum -c
          tar xzf pair.tar.gz -C proven
          out=$(./out/fevm_replay chain proven/0x19338ca proven/0x19338cb)
          echo "$out" | grep -E "MATCH|stateRoot|chain of"
          echo "$out" | grep -q "chain of 2 blocks: 1 of 1 links hold"
          if ./out/fevm_replay chain proven/0x19338cb proven/0x19338ca > swapped.txt; then cat swapped.txt; exit 1; fi
          grep "LINK proven/0x19338ca" swapped.txt

      - name: One wei more in a withdrawal fails the stateless state root and the withdrawals root
        run: |
          cp -r proven/0x19335e5 proven/tampered2
          python3 - <<'PY'
          import json
          p = "proven/tampered2/block.json"
          doc = json.load(open(p))
          w = doc["result"]["withdrawals"][0]
          w["amount"] = hex(int(w["amount"], 16) + 1)
          json.dump(doc, open(p, "w"))
          PY
          if ./out/fevm_replay chain proven/tampered2 > tampered2.txt; then cat tampered2.txt; exit 1; fi
          grep "STATE ROOT" tampered2.txt
          grep "WITHDRAWALS" tampered2.txt

      - name: One wei more in the saved prestate fails the proof
        run: |
          cp -r proven/0x192f56b proven/tampered
          python3 - <<'PY'
          import json
          p = "proven/tampered/prestate.json"
          doc = json.load(open(p))
          first = doc["result"][0]["result"]
          account = next(iter(first))
          first[account]["balance"] = hex(int(first[account]["balance"], 16) + 1)
          json.dump(doc, open(p, "w"))
          PY
          if ./out/fevm_replay chain proven/tampered > tampered.txt; then cat tampered.txt; exit 1; fi
          grep "DIFF  balance" tampered.txt

      - name: Fuzzed WETH9 port answers well-formed calls as mainnet WETH does
        run: ./out/fevm_replay fuzz fixtures/code/weth9-mainnet.hex out/weth9/WETH9.runtime.bin 2000 40 1

      - name: Fuzzed V2 pair port answers well-formed calls as the deployed pair does
        run: ./out/fevm_replay fuzz-pair fixtures/code/uniswap-v2-pair-mainnet.hex out/pair/UniswapV2Pair.runtime.bin fixtures/code/weth9-mainnet.hex 1000 60 1

      - name: Fuzzed USDT port answers every call as mainnet USDT does
        run: ./out/fevm_replay fuzz-usdt fixtures/code/usdt-mainnet.hex out/usdt/TetherToken.runtime.bin 1000 60 1

      - name: Fuzzed DAI port answers every call as mainnet DAI does
        run: ./out/fevm_replay fuzz-dai fixtures/code/dai-mainnet.hex out/dai/Dai.runtime.bin 1000 60 1

      - name: Fuzzed USDC proxy port forwards and administers as the deployed proxy does
        run: ./out/fevm_replay fuzz-proxy fixtures/code/usdc-proxy-mainnet.hex out/usdc-proxy/FiatTokenProxy.runtime.bin fixtures/code/weth9-mainnet.hex 500 60 1

      - name: Mutants planted in the V2 pair port are caught
        # `mutants` builds the port with the `fe` on the PATH.
        run: |
          out=$(./out/fevm_replay mutants ports/uniswap-v2-pair UniswapV2Pair fixtures/code/uniswap-v2-pair-mainnet.hex fixtures/code/weth9-mainnet.hex 8)
          echo "$out"
          echo "$out" | grep -q "mutants built"

      - name: Mainnet fixtures replay exactly
        run: ./out/fevm_replay fixtures/mainnet/*.json

      - name: Every malformed fixture is reported, not a crash
        run: |
          for f in fixtures/malformed/*.json; do
            set +e; out=$(./out/fevm_replay "$f"); code=$?; set -e
            echo "$out"
            if [ "$code" != 1 ] || [ "${out#ERROR}" = "$out" ]; then echo "not reported: $f (exit $code)"; exit 1; fi
          done

      - name: Every negative fixture is caught
        run: |
          for f in fixtures/negative/*.json; do
            if ./out/fevm_replay "$f"; then echo "missed: $f"; exit 1; fi
          done
