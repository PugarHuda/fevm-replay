name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # fevm needs `std::native::sha256_compress`, which landed on Fe master right
  # after 26.6.0 (argotorg/fe#1977). The contest allows pinning a master commit.
  FE_REVISION: 4608e5fdfa3783ec78347f297ad0fced8928fcc7
  RUST_VERSION: 1.99.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore the Fe compiler
        id: fe-cache
        uses: actions/cache@v4
        with:
          path: ~/fe
          key: fe-${{ runner.os }}-${{ env.FE_REVISION }}-${{ env.RUST_VERSION }}-cranelift

      - name: Build the Fe compiler
        if: steps.fe-cache.outputs.cache-hit != 'true'
        # Fe's build generates its tree-sitter grammar, which needs the
        # tree-sitter CLI and node; `cranelift` is the native backend.
        run: |
          npm install -g tree-sitter-cli@0.24.7
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo "+$RUST_VERSION" install --locked --root ~/fe \
            --git https://github.com/argotorg/fe --rev "$FE_REVISION" --features cranelift fe

      - run: echo "$HOME/fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - run: fe fmt --check
      - run: fe test --backend native .

      - name: Build fevm-replay
        run: fe build --backend native -O 2 --emit executable --out-dir out .

      - name: Mainnet fixtures replay exactly
        run: ./out/fevm_replay fixtures/mainnet/*.json

      - name: Every negative fixture is caught
        run: |
          for f in fixtures/negative/*.json; do
            if ./out/fevm_replay "$f"; then echo "missed: $f"; exit 1; fi
          done
