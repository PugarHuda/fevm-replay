name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # fevm needs `std::native::sha256_compress`, which landed on Fe master right
  # after 26.6.0 (argotorg/fe#1977). The contest allows pinning a master commit.
  FE_REVISION: 4608e5fdfa3783ec78347f297ad0fced8928fcc7
  RUST_VERSION: 1.99.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore the Fe compiler
        id: fe-cache
        uses: actions/cache@v4
        with:
          path: ~/fe
          key: fe-${{ runner.os }}-${{ env.FE_REVISION }}-${{ env.RUST_VERSION }}-cranelift

      - name: Build the Fe compiler
        if: steps.fe-cache.outputs.cache-hit != 'true'
        # Fe's build generates its tree-sitter grammar, which needs the
        # tree-sitter CLI and node; `cranelift` is the native backend.
        run: |
          npm install -g tree-sitter-cli@0.24.7
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo "+$RUST_VERSION" install --locked --root ~/fe \
            --git https://github.com/argotorg/fe --rev "$FE_REVISION" --features cranelift fe

      - run: echo "$HOME/fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - run: fe fmt --check
      - run: fe test --backend native .

      - name: WETH9 port
        working-directory: ports/weth9
        run: |
          fe fmt --check
          fe test .
          fe build -O 2 --out-dir ../../out/weth9 .

      - name: Uniswap V2 pair port
        working-directory: ports/uniswap-v2-pair
        run: |
          fe fmt --check
          fe test .
          fe build -O 2 --out-dir ../../out/pair .

      - name: USDT (TetherToken) port
        working-directory: ports/usdt
        run: |
          fe fmt --check
          fe test .
          fe build -O 2 --out-dir ../../out/usdt .

      - name: USDC proxy port
        working-directory: ports/usdc-proxy
        run: |
          fe fmt --check
          fe build -O 2 --out-dir ../../out/usdc-proxy .

      - name: Build fevm-replay
        run: fe build --backend native -O 2 --emit executable --out-dir out .

      - name: Fuzzed WETH9 port answers well-formed calls as mainnet WETH does
        run: ./out/fevm_replay fuzz fixtures/code/weth9-mainnet.hex out/weth9/WETH9.runtime.bin 2000 40 1

      - name: Fuzzed V2 pair port answers well-formed calls as the deployed pair does
        run: ./out/fevm_replay fuzz-pair fixtures/code/uniswap-v2-pair-mainnet.hex out/pair/UniswapV2Pair.runtime.bin fixtures/code/weth9-mainnet.hex 1000 60 1

      - name: Fuzzed USDT port answers every call as mainnet USDT does
        run: ./out/fevm_replay fuzz-usdt fixtures/code/usdt-mainnet.hex out/usdt/TetherToken.runtime.bin 1000 60 1

      - name: Fuzzed USDC proxy port forwards and administers as the deployed proxy does
        run: ./out/fevm_replay fuzz-proxy fixtures/code/usdc-proxy-mainnet.hex out/usdc-proxy/FiatTokenProxy.runtime.bin fixtures/code/weth9-mainnet.hex 500 60 1

      - name: Mutants planted in the V2 pair port are caught
        run: |
          out=$(./out/fevm_replay mutants ports/uniswap-v2-pair UniswapV2Pair fixtures/code/uniswap-v2-pair-mainnet.hex fixtures/code/weth9-mainnet.hex 8)
          echo "$out"
          echo "$out" | grep -q "mutants built"

      - name: Mainnet fixtures replay exactly
        run: ./out/fevm_replay fixtures/mainnet/*.json

      - name: Every malformed fixture is reported, not a crash
        run: |
          for f in fixtures/malformed/*.json; do
            set +e; out=$(./out/fevm_replay "$f"); code=$?; set -e
            echo "$out"
            if [ "$code" != 1 ] || [ "${out#ERROR}" = "$out" ]; then echo "not reported: $f (exit $code)"; exit 1; fi
          done

      - name: Every negative fixture is caught
        run: |
          for f in fixtures/negative/*.json; do
            if ./out/fevm_replay "$f"; then echo "missed: $f"; exit 1; fi
          done
