name: Site

on:
  push:
    branches: [main]
    paths: [site/**, demo/tour-v7.mp4, .github/workflows/pages.yml]
  # The follower's commits come from GITHUB_TOKEN, which starts no push
  # workflow: deploy when it finishes.
  # Safe here: it checks out this repository's main, never the triggering
  # run's code, and only after a successful Follow run on main.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Follow]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      attestations: write
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # The tour is served from the site too; it lives once, in demo/.
      - run: cp demo/tour-v7.mp4 site/tour.mp4
      # The browser modules the site serves, attested as this repository's at
      # this commit (CI rebuilds them and checks they are byte for byte these):
      # gh attestation verify fevm_replay_web.wasm -R PugarHuda/fevm-replay
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            site/wasm/fevm_replay_web.wasm
            site/wasm/next/fevm_replay_web.wasm
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      # deploy-pages sometimes asks for the artifact before GitHub lists it
      # ("No artifacts named github-pages"): wait until it is listed.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            [ "$n" -gt 0 ] && exit 0
            sleep 2
          done
          echo "the artifact was not listed after 60 s"
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
