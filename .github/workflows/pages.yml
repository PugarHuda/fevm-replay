name: Site

on:
  push:
    branches: [main]
    paths: [site/**, demo/tour-v5.mp4, .github/workflows/pages.yml]
  # The follower's commits come from GITHUB_TOKEN, which starts no push
  # workflow: deploy when it finishes.
  workflow_run:
    workflows: [Follow]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # The tour is served from the site too; it lives once, in demo/.
      - run: cp demo/tour-v5.mp4 site/tour.mp4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
