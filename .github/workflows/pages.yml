name: Site

on:
  push:
    branches: [main]
    paths: [site/**, demo/tour-v5.mp4, .github/workflows/pages.yml]
  # The follower's commits come from GITHUB_TOKEN, which starts no push
  # workflow: deploy when it finishes.
  workflow_run:
    workflows: [Follow]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # The tour is served from the site too; it lives once, in demo/.
      - run: cp demo/tour-v5.mp4 site/tour.mp4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # deploy-pages sometimes asks for the artifact before GitHub lists it
      # ("No artifacts named github-pages"): wait until it is listed.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            [ "$n" -gt 0 ] && exit 0
            sleep 2
          done
          echo "the artifact was not listed after 60 s"
      - id: deployment
        uses: actions/deploy-pages@v4
