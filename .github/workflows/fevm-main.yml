name: fevm main

# Every night: fevm-replay against fevm's latest main instead of the pinned
# commit, on the mainnet fixtures and the proven blocks. A failure here
# means fevm changed in a way real mainnet blocks notice (or that its API
# moved); the pinned build in CI stays green either way.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FE_REVISION: e6e6342b252082f3fd8af5b9f763cb13296bf0a1
  RUST_VERSION: 1.99.0

jobs:
  mainnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Restore only: this job runs fevm's unpinned main, so it never saves
      # the compiler cache CI shares.
      - name: Restore the Fe compiler
        id: fe-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/fe
          key: fe-${{ runner.os }}-${{ env.FE_REVISION }}-${{ env.RUST_VERSION }}-cranelift

      - name: Build the Fe compiler
        if: steps.fe-cache.outputs.cache-hit != 'true'
        run: |
          npm install -g tree-sitter-cli@0.24.7
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo "+$RUST_VERSION" install --locked --root ~/fe \
            --git https://github.com/argotorg/fe --rev "$FE_REVISION" --features cranelift fe

      - run: echo "$HOME/fe/bin" >> "$GITHUB_PATH"

      - name: Point fe.toml at fevm's latest main
        run: |
          head=$(git ls-remote https://github.com/fe-lang/fevm refs/heads/main | cut -f1)
          echo "fevm main: $head"
          sed -i -E "s/(fe-lang\/fevm\", rev = \")[0-9a-f]{40}/\1$head/" fe.toml ingots/replay_core/fe.toml web/fe.toml
          grep fevm fe.toml ingots/replay_core/fe.toml

      - name: Build fevm-replay
        run: fe build --backend native -O 2 --emit executable --out-dir out .

      - name: Mainnet transactions and proven blocks
        run: |
          ./out/fevm_replay fixtures/mainnet/*.json
          mkdir -p proven
          for f in fixtures/proven/*.tar.gz; do tar xzf "$f" -C proven; done
          out=$(./out/fevm_replay chain proven/0x19335e5)
          echo "$out" | grep -E "MATCH|stateRoot|fevm_chain"
          echo "$out" | grep -q "71/71 transactions MATCH"
          echo "$out" | grep -q "hashes to the header's stateRoot"
          out=$(./out/fevm_replay chain proven/0x192f56b)
          echo "$out" | grep -q "126/126 transactions MATCH"
