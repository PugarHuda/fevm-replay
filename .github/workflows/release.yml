name: Release

# A tag `v*` publishes the fevm-replay executable for x86-64 Linux with the
# ports' bytecode and the fixtures, so trying it needs no Fe toolchain.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  FE_REVISION: e6e6342b252082f3fd8af5b9f763cb13296bf0a1
  # Every port builds with it too (see ci.yml).
  RUST_VERSION: 1.99.0

jobs:
  release:
    runs-on: ubuntu-latest
    # Publishing the release, and its build provenance (SLSA, signed through
    # Sigstore): gh attestation verify <archive> -R PugarHuda/fevm-replay
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Built from source, not restored from a cache: what is attested
      # must not rest on a cache another workflow could have written.
      - name: Build the Fe compiler
        run: |
          npm install -g tree-sitter-cli@0.24.7
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo "+$RUST_VERSION" install --locked --root ~/fe \
            --git https://github.com/argotorg/fe --rev "$FE_REVISION" --features cranelift fe


      - run: echo "$HOME/fe/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          fe build --backend native -O 2 --emit executable --out-dir out .
          (cd ports/usdc-proxy && fe build -O 2 --out-dir ../../out/usdc-proxy .)
          (cd ports/system && fe build -O 2 --out-dir ../../out/system .)
          for port in weth9 uniswap-v2-pair usdt dai; do
            (cd "ports/$port" && fe build -O 2 --out-dir "../../out/$port" .)
          done
          ./out/fevm_replay fixtures/mainnet/*.json

      - name: Package
        run: |
          name="fevm-replay-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "$name/ports"
          cp out/fevm_replay README.md LICENSE "$name/"
          cp -r fixtures docs "$name/"
          # The browser's check, for Node.js alone: node wasm/cli.mjs [number|block.tar.gz]
          mkdir -p "$name/wasm"
          cp site/wasm/*.mjs site/wasm/fevm_replay_web.wasm site/wasm/fevm_replay_web.manifest.json "$name/wasm/"
          for port in weth9 uniswap-v2-pair usdt usdc-proxy dai system; do
            mkdir -p "$name/ports/$port"
            cp out/$port/*.runtime.bin "$name/ports/$port/"
          done
          ldd out/fevm_replay > "$name/LINKED.txt" || true
          tar czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Attest where the archive and the executable came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ env.ARCHIVE }}
            out/fevm_replay

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
            --title "fevm-replay $GITHUB_REF_NAME" \
            --notes "fevm-replay for x86-64 Linux (built on ubuntu-latest; see LINKED.txt for the libraries it needs), the five ports' and the system contracts' runtime bytecode, the fixtures (one block validated statelessly: mkdir proven && tar xzf fixtures/proven/0x19335e5.tar.gz -C proven && ./fevm_replay chain proven/0x19335e5). Built from ${GITHUB_SHA} with Fe ${FE_REVISION}."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fevm-replay
          path: ${{ env.ARCHIVE }}

  # The same release for Apple silicon: fevm-replay built natively on macOS
  # (Fe builds AArch64 macOS executables), packaged with the Linux job's
  # ports' bytecode and fixtures, which do not depend on the platform.
  macos:
    needs: release
    runs-on: macos-latest
    # Publishing the release, and its build provenance (SLSA, signed through
    # Sigstore): gh attestation verify <archive> -R PugarHuda/fevm-replay
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Built from source, not restored from a cache: what is attested
      # must not rest on a cache another workflow could have written.
      - name: Build the Fe compiler
        run: |
          npm install -g tree-sitter-cli@0.24.7
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo "+$RUST_VERSION" install --locked --root ~/fe \
            --git https://github.com/argotorg/fe --rev "$FE_REVISION" --features cranelift fe

      - run: echo "$HOME/fe/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          fe build --backend native -O 2 --emit executable --out-dir out .
          ./out/fevm_replay fixtures/mainnet/*.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fevm-replay

      - name: Package
        run: |
          linux=$(ls fevm-replay-*-x86_64-linux.tar.gz)
          tar xzf "$linux"
          from="${linux%.tar.gz}"
          name="${from%-x86_64-linux}-aarch64-macos"
          mv "$from" "$name"
          cp out/fevm_replay "$name/fevm_replay"
          otool -L out/fevm_replay > "$name/LINKED.txt" || true
          mkdir proven && tar xzf fixtures/proven/0x19335e5.tar.gz -C proven
          "$name/fevm_replay" chain proven/0x19335e5 | grep -q "hashes to the header's stateRoot"
          tar czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Attest where the archive and the executable came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ env.ARCHIVE }}
            out/fevm_replay

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fevm-replay-macos
          path: ${{ env.ARCHIVE }}
