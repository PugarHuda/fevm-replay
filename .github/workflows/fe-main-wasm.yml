name: Fe main wasm

# Every night: the browser module built with Fe's latest main, twice.
#  1. Without our two workarounds for argotorg/fe#2056 (web/tailcalls.py and
#     a 64 MiB stack): every saved mainnet block of the site. They overflowed
#     until #2056 was fixed (argotorg/fe#2060); the verdict is written to the
#     run's summary.
#  2. With them, as fevm-replay built the module while #2056 was open.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Fe's latest (default branch) (wasm backend)
        run: |
          head=$(git ls-remote https://github.com/argotorg/fe HEAD | cut -f1)
          test -n "$head"
          echo "FE_HEAD=$head" >> "$GITHUB_ENV"
          npm config set allow-scripts=tree-sitter-cli --location=user || true
          npm install -g tree-sitter-cli@0.24.7
          cargo install --locked --root ~/fe-main --git https://github.com/argotorg/fe --rev "$head" --features wasm fe
          ~/fe-main/bin/fe --version

      - name: Without the workarounds (is argotorg/fe#2056 fixed?)
        run: |
          mkdir -p out/without
          (cd web && ~/fe-main/bin/fe build --backend wasm -O 2 --out-dir ../out/without .)
          cp site/wasm/*.mjs out/without/
          held=0; blocks=0; failed=""
          for b in site/wasm/block-*.tar.gz; do
            blocks=$((blocks+1))
            if node out/without/cli.mjs "$b" > without.txt 2>&1 && grep -q "every root holds" without.txt; then
              held=$((held+1))
            else
              failed="$failed $(basename $b) ($(grep -m1 -oE 'RangeError.*|RuntimeError.*|unreachable' without.txt || tail -1 without.txt))"
            fi
          done
          if [ "$held" = "$blocks" ]; then
            verdict="FIXED: all $blocks saved blocks validate with Fe main ${FE_HEAD:0:9}, no return_call rewrite, default stack"
          else
            verdict="not yet: $held of $blocks saved blocks validate with Fe main ${FE_HEAD:0:9} without the workarounds;$failed"
          fi
          echo "$verdict"
          echo "::notice title=argotorg/fe#2056::$verdict"
          echo "### argotorg/fe#2056: $verdict" >> "$GITHUB_STEP_SUMMARY"

      # The workarounds fevm-replay needed while #2056 was open. Fe's latest may
      # emit instructions web/tailcalls.py does not rewrite (SIMD since #2060),
      # which is no regression in Fe; this step only reports.
      - name: With the workarounds
        continue-on-error: true
        run: |
          mkdir -p out/with
          (cd web && ~/fe-main/bin/fe build --backend wasm -O 2 --wasm-stack-size 67108864 --out-dir ../out/with .)
          python3 web/tailcalls.py out/with/fevm_replay_web.wasm out/with/fevm_replay_web.manifest.json
          cp site/wasm/*.mjs out/with/
          node out/with/cli.mjs site/wasm/block-0x19335c4.tar.gz | tail -3
