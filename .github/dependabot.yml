# Weekly updates for the pinned actions and the test tools' npm packages,
# one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: [/e2e, /docs/eip4762-check]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
